name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build:tsc
      - run: pnpm typecheck
      - run: pnpm test

      # The bundles in git must match the sources they were built from.
      - name: Verify committed bundles are up to date
        run: |
          pnpm build:bundle
          git diff --exit-code -- dist plugins || {
            echo "::error::Committed bundles are stale. Run 'pnpm build:bundle' and commit."
            exit 1
          }

  # The whole premise of this action is that a runner installs nothing.
  # This job has no dependency installation step at all.
  runs-without-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Execute the committed runtime
        run: node dist/index.js run --config examples/smoke.yml --plugins plugins

  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run this repository's action locally
        uses: ./
        with:
          config: examples/smoke.yml
          log-level: debug

      - name: Run a single flow
        uses: ./
        with:
          config: examples/smoke.yml
          flow: gating
          log-level: info

  # Proves the AI step end to end with no vendor key. The mock rejects any
  # request whose prompt lacks the expected text, so a green job means real
  # upstream data crossed the model boundary.
  ai-step:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start a local OpenAI-compatible endpoint
        run: |
          PORT=8787 MOCK_REQUIRE_SUBSTRING="Hacker News" \
            node scripts/mock-openai-server.mjs > mock.log 2>&1 &
          sleep 1
          curl -sS -o /dev/null "http://127.0.0.1:8787/v1/chat/completions" || true

      - name: Run the digest pipeline against it
        uses: ./
        with:
          config: examples/ai-digest.yml
          log-level: info
        env:
          OPENAI_API_BASE: http://127.0.0.1:8787/v1
          OPENAI_API_KEY: ci-placeholder

      - name: Show what the endpoint received
        if: always()
        run: cat mock.log
