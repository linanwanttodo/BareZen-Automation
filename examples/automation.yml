# Example automation config — runs with no secrets and no setup beyond this
# repository's action. See examples/with-secrets.yml for notification plugins
# and the AI-backed pipeline.
#
# A step reads an earlier step's output with `input:`, which accepts field paths
# (`news.articles`, `news.articles[0].title`). Because every output is an
# object, markdown-report or text-template turns a list into text.

plugins:
  - rss
  - hackernews
  - markdown-report

flows:
  # GitHub-hosted feeds, so this example does not depend on a third-party site
  # answering from a runner (hnrss.org timed out from one while working locally).
  news-scan:
    - plugin: rss
      inputs:
        url: https://github.com/cli/cli/releases.atom
        limit: 10
      output: cliReleases

    - plugin: rss
      inputs:
        url: https://github.com/tmux/tmux/commits.atom
        limit: 10
      output: tmuxCommits

  # Fetch, then render a report with no AI step and no credentials.
  digest:
    - plugin: hackernews
      inputs:
        tag: front_page
        limit: 8
      output: stories

    - plugin: markdown-report
      input: { articles: stories.articles }
      inputs:
        heading: Hacker News front page
        limit: 8
      output: report

settings:
  defaultTimeout: 60000
  logLevel: info
