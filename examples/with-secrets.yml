# Illustrative config for plugins that need credentials.
#
# `${{ secrets.NAME }}` inside an automation.yml is NOT evaluated by GitHub —
# Actions expressions only run in workflow files. The framework resolves these
# references from the process environment, so every secret a flow touches must
# be passed into the action step via `env:` (or `secrets.inherit`), including
# for flows you are not running: resolution happens across the whole config
# before the first step executes.

plugins:
  - telegram
  - email
  - github-star

flows:
  announce:
    - plugin: telegram
      inputs:
        chatId: ${{ secrets.TELEGRAM_CHAT_ID }}
        message: "automation run finished"

    - plugin: email
      inputs:
        to: team@example.com
        subject: Automation finished
        body: See the Actions log for run details.
        smtpHost: smtp.example.com
        smtpUser: ${{ secrets.SMTP_USER }}
        smtpPass: ${{ secrets.SMTP_PASS }}

  star-picks:
    - plugin: github-star
      inputs:
        repo: owner/repo

settings:
  defaultTimeout: 60000
