# Offline smoke config: exercises plugin loading, step sequencing and context
# passing without touching the network or any secret. Used by CI.

plugins:
  - condition
  - schedule
  - text-template

flows:
  smoke:
    - plugin: condition
      inputs:
        expression: "true"
        value: ok
      output: gate

    - plugin: schedule
      inputs:
        cron: "0 9 * * *"
      output: tick

    - plugin: text-template
      inputs:
        template: "digest of {{count}} items"
        vars:
          count: 3
      output: digest

    # Field path binding: reads the previous step's rendered string.
    - plugin: text-template
      input: { vars: digest }
      inputs:
        template: "forwarded: {{text}}"
      output: forwarded
