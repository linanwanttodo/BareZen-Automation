# Offline smoke config: exercises plugin loading, step sequencing, context
# passing and the `if:` gate without touching the network or any secret.
# Used by CI.

plugins:
  - text-template

flows:
  shaping:
    - plugin: text-template
      inputs:
        template: "digest of {{count}} items"
        vars:
          count: 3
      output: digest

    # Field path binding: reads the previous step's rendered string.
    - plugin: text-template
      input: { vars: digest }
      inputs:
        template: "forwarded: {{text}}"
      output: forwarded

  gating:
    - plugin: text-template
      inputs:
        template: "{{n}}"
        vars:
          n: 7
      output: number

    # Path against an earlier step's output; "7" compares numerically.
    - plugin: text-template
      if: number.text > 5
      inputs:
        template: "executed"
      output: ran

    # Same reference, unsatisfied: this step must be skipped, not failed.
    - plugin: text-template
      if: number.text > 900
      inputs:
        template: "never"
      output: skipped

    - plugin: text-template
      if: github.eventName != ""
      inputs:
        template: "always"
      output: githubGate

settings:
  defaultTimeout: 60000
  logLevel: info
