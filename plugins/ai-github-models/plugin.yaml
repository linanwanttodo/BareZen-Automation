name: ai-github-models
runtime: node
entry: dist/index.js
description: Chat with a model through GitHub Models using the workflow's GITHUB_TOKEN
inputs:
  prompt: { required: true, type: string }
  system: { required: false, type: string }
  model: { required: false, type: string, default: openai/gpt-4o-mini }
outputs:
  text: { type: string, description: Model reply }
