name: github-pr
runtime: node
entry: dist/index.js
description: Create/merge a GitHub Pull Request
inputs:
  repo: { required: true, type: string }
  title: { required: true, type: string }
  body: { required: false, type: string }
  base: { required: false, type: string, default: main }
  head: { required: true, type: string }
  action: { required: false, type: string, default: create }
outputs:
  result: { type: object }
