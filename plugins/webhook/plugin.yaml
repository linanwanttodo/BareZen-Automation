name: webhook
runtime: node
entry: dist/index.js
description: POST a JSON payload to an arbitrary endpoint
inputs:
  payload: { required: true, type: string, description: "JSON text, or any string wrapped as {text}" }
  url: { required: false, type: string, description: Falls back to GENERIC_WEBHOOK_URL }
outputs:
  sent: { type: boolean }
  status: { type: number, description: Response status code }
